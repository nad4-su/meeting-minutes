services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-meetinguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meetingpass}
      POSTGRES_DB: ${POSTGRES_DB:-meetingminutes}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meetinguser}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-meetinguser}:${POSTGRES_PASSWORD:-meetingpass}@db:5432/${POSTGRES_DB:-meetingminutes}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  test:
    profiles: ["tools"]
    image: node:22-alpine
    working_dir: /app
    environment:
      CI: "true"
    volumes:
      - .:/app
      - test_node_modules:/app/node_modules
    command: sh -c "npm ci && npm test"

volumes:
  pgdata:
  uploads:
  test_node_modules:
